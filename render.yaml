services:
  - type: web
    name: scamshield
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: GEMMA_BASE_URL
        sync: false
      - key: GEMMA_MODEL
        value: gemma3
